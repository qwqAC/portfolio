<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chong | 视觉设计者</title>
  <meta name="description" content="阿冲,视觉设计者:包括网站、平面、视频、和交互设计">
  <meta name="theme-color" content="#17f700">
  <link rel="icon" href="meta/favicon_32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="meta/favicon_64.png" sizes="64x64" type="image/png">
  <link rel="apple-touch-icon" href="meta/favicon_180.png" sizes="180x180">
  <script defer="defer" src="js/chunk-vendors.80e23a73.js"></script>
  <script defer="defer" src="js/app.fc5bab1d.js"></script>
  <link href="css/app.1aedfee5.css" rel="stylesheet">
</head>
<body>
  <div id="app"></div>

<script>
// 等动画加载后初始化叠加元素
function initOverlays() {
  var container = document.querySelector('.contact_animation');
  if (!container) { setTimeout(initOverlays, 500); return; }
  container.style.position = 'relative';
  
  // 删除旧的 image
  var svg = document.querySelector('.contact_animation svg');
  if (svg) {
    svg.querySelectorAll('image').forEach(function(img) { img.style.display = 'none'; });
  }
  
  // 三个便签 - 直接显示保存好的图片
  var stickers = [
    {left:'22.84%', top:'44.94%', w:'8.88%', h:'11.77%', rotate:'-5deg', img:'img/my_sticker_0.png'},
    {left:'33.70%', top:'42.96%', w:'9.97%', h:'12.97%', rotate:'-3deg', img:'img/my_sticker_1.png'},
    {left:'45.48%', top:'46.23%', w:'10.07%', h:'13.07%', rotate:'-2deg', img:'img/my_sticker_2.png'},
  ];
  stickers.forEach(function(pos, i) {
    // 白色底遮住原来的便签
    var bg = document.createElement('div');
    bg.style.cssText = 'position:absolute;left:'+pos.left+';top:'+pos.top+';width:'+pos.w+';height:'+pos.h+';background:#f7f7f7;z-index:149;transform:rotate('+pos.rotate+');';
    container.appendChild(bg);
    // 用户写的便签
    var st = document.createElement('img');
    st.src = pos.img;
    st.style.cssText = 'position:absolute;left:'+pos.left+';top:'+pos.top+';width:'+pos.w+';height:'+pos.h+';z-index:150;transform:rotate('+pos.rotate+');';
    container.appendChild(st);
  });
}

function makeMovable(el) {
  el.style.cursor = 'move';
  el.addEventListener('mousedown', function(e) {
    e.stopPropagation();
    e.preventDefault();
    var startX = e.clientX, startY = e.clientY;
    var origLeft = el.offsetLeft, origTop = el.offsetTop;
    var origW = el.offsetWidth, origH = el.offsetHeight;
    
    function onMove(ev) {
      // 如果按 Shift 键则缩放，否则移动
      if (ev.shiftKey) {
        el.style.width = Math.max(20, origW + ev.clientX - startX) + 'px';
        el.style.height = Math.max(20, origH + ev.clientY - startY) + 'px';
      } else {
        el.style.left = (origLeft + ev.clientX - startX) + 'px';
        el.style.top = (origTop + ev.clientY - startY) + 'px';
      }
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

setTimeout(initOverlays, 4500);
</script>
</body>
</html>
