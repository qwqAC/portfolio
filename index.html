<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, mustigate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chong | 视觉设计者</title>
  <meta name="description" content="阿冲,视觉设计者:包括网站、平面、视频、和交互设计">
  <meta name="theme-color" content="#17f700">
  <link rel="icon" href="meta/favicon_32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="meta/favicon_64.png" sizes="64x64" type="image/png">
  <link rel="apple-touch-icon" href="meta/favicon_180.png" sizes="180x180">
  <link rel="preload" href="img/my_sticker_0.png" as="image">
  <link rel="preload" href="img/my_sticker_1.png" as="image">
  <link rel="preload" href="img/my_sticker_2.png" as="image">
  <link href="css/app.1aedfee5.css?v=20260929j" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- 静态 loading：保证2秒可见 -->
    <div class="preload" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#171717;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:999999;">
      <div style="width:50px;height:50px;background:#fff;animation:spin360 1s linear infinite;border-radius:4px;"></div>
      <div style="color:#17f700;font-family:monospace;font-size:.9rem;letter-spacing:.3rem;margin-top:1.2rem;">LOADING</div>
    </div>
  </div>
  <style>@keyframes spin360{from{transform:rotate(0)}to{transform:rotate(360deg)}}</style>

<script>
// 2秒后移除静态loading，动态加载Vue
setTimeout(function() {
  var p = document.querySelector('.preload');
  if (p) p.remove();

  var s1 = document.createElement('script');
  s1.src = 'js/chunk-vendors.80e23a73.js?v=20260929j';
  s1.onload = function() {
    var s2 = document.createElement('script');
    s2.src = 'js/app.fc5bab1d.js?v=20260929j';
    document.body.appendChild(s2);
  };
  document.body.appendChild(s1);
}, 2000);

// 10秒兜底
setTimeout(function() {
  var l = document.querySelector('.loading');
  if (l && getComputedStyle(l).display !== 'none') l.style.display = 'none';
  document.body.style.overflow = 'auto';
}, 10000);

// 等动画加载后初始化叠加元素
function initOverlays() {
  var container = document.querySelector('.contact_animation');
  if (!container) { setTimeout(initOverlays, 500); return; }
  container.style.position = 'relative';

  var svg = document.querySelector('.contact_animation svg');
  if (svg) {
    svg.querySelectorAll('image').forEach(function(img) { img.style.display = 'none'; });
  }

  var stickers = [
    {left:'22.84%', top:'44.94%', w:'8.88%', h:'11.77%', rotate:'-5deg', img:'img/my_sticker_0.png'},
    {left:'33.70%', top:'42.96%', w:'9.97%', h:'12.97%', rotate:'-3deg', img:'img/my_sticker_1.png'},
    {left:'45.48%', top:'46.23%', w:'10.07%', h:'13.07%', rotate:'-2deg', img:'img/my_sticker_2.png'},
  ];
  stickers.forEach(function(pos, i) {
    var bg = document.createElement('div');
    bg.style.cssText = 'position:absolute;left:'+pos.left+';top:'+pos.top+';width:'+pos.w+';height:'+pos.h+';background:#f7f7f7;z-index:149;transform:rotate('+pos.rotate+');';
    container.appendChild(bg);
    var st = document.createElement('img');
    st.src = pos.img;
    st.style.cssText = 'position:absolute;left:'+pos.left+';top:'+pos.top+';width:'+pos.w+';height:'+pos.h+';z-index:150;transform:rotate('+pos.rotate+');';
    container.appendChild(st);
  });
}

setTimeout(initOverlays, 5000);
</script>
</body>
</html>
